{% extends "base.html" %}
{% block content %}
<section class="band-night"><div class="wrap" style="padding-top:72px;padding-bottom:48px;display:flex;flex-direction:column;gap:16px">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="{{ root }}garage/index.html">Garage</a><span>/</span><span>{{ h.title }}</span></nav>
  <span class="eyebrow brass">{{ h.eyebrow }}</span>
  <h1 style="font-size:clamp(34px,5vw,60px);line-height:1.02;letter-spacing:-0.02em;text-wrap:balance;max-width:900px">{{ h.title }}</h1>
  <p class="serif" style="margin:0;max-width:740px;font-size:19px;line-height:29px;color:#D9D4C8">{{ h.lead }}</p>
</div></section>
<div class="wrap section"><div class="grid" style="--min:280px">{% for it in h['items'] %}<a class="card garage-card" href="{{ it.href }}"><span class="eyebrow">{{ it.eyebrow }}</span><h2>{{ it.title }}</h2><p>{{ it.text|striplk|truncate(200) }}</p><span class="go">Read it →</span></a>{% endfor %}</div></div>
{% endblock %}
